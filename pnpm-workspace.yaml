catalogMode: 'strict'
shellEmulator: true

peerDependencyRules:
  ignoreMissing:
    - eslint-plugin-import
  allowAny:
    - eslint

minimumReleaseAgeExclude:
  - turbo
  - '@turbo/darwin-64'
  - '@turbo/darwin-arm64'
  - '@turbo/linux-64'
  - '@turbo/linux-arm64'
  - '@turbo/windows-64'
  - '@turbo/windows-arm64'

packages:
  - 'renderer'
  - 'assets'

catalog:
  '@types/node': ^26.6.2
  'typescript': ^6.0.3
  'tsx': ^4.23.15
  'rimraf': '^6.1.3'
  'turbo': 2.11.5
  'husky': '^9.1.7'
  'lint-staged': '^17.5.1'
  dotenv-cli: ^11.0.0
  dotenv: ^18.0.4

catalogs:
  plugins-stack:
    '@vitoria-rodrigues/agent-mesh': 'github:Vitoria-Rodrigues/agent-mesh'

  tooling-stack:
    '@eslint/js': '10.0.1'
    '@typescript-eslint/eslint-plugin': 8.70.1
    'eslint': 10.11.0
    'eslint-import-resolver-typescript': '4.4.5'
    'eslint-plugin-import-x': '^4.17.1'
    'eslint-plugin-mdx': '3.8.1'
    'eslint-plugin-prettier': '^5.5.6'
    'eslint-config-prettier': '^10.1.8'
    'jiti': ^2.7.0
    'prettier': 3.9.9
    'typescript-eslint': 8.70.1

  shared-stack:
    'zod': ^4.6.5
    'tailwindcss': ^4.3.3

  web-stack:
    'react': ^19.3.0
    'react-dom': ^19.3.0
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@eslint-react/eslint-plugin': ^5.20.8
    'eslint-plugin-react-refresh': ^0.5.7

  studio-stack:
    'react-icons': ^5.7.0

allowBuilds:
  '@swc/core': true
  'esbuild': true
  'unrs-resolver': true
